apiVersion: apps/v1
kind: Deployment

metadata:
  name: fastshop
  namespace: fastshop

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fastshop

  template:
    metadata:
      labels:
        app: fastshop

    spec:
      containers:
        - name: fastshop

          image: ghcr.io/ankhang24112411-sudo/fastshop:a7e4fc9f1b6acff4efc26e8986a6a8e10ad91dec
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: fastshop-config

            - secretRef:
                name: fastshop-secret

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "768Mi"
