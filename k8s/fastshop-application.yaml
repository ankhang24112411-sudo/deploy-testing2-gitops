apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: fastshop-gitops
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ankhang24112411-sudo/deploy-testing2-gitops.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: fastshop

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
