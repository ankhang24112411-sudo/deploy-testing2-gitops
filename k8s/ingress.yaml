apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: fastshop-ingress
  namespace: fastshop

spec:
  ingressClassName: traefik

  rules:
    - host: ankhangk6.click
      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: fastshop-service
                port:
                  number: 80

    - host: www.ankhangk6.click
      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: fastshop-service
                port:
                  number: 80
